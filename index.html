<style>
/* Layout: app de celular com faixa de mar no topo, conteúdo rolável e barra de abas fixa embaixo; no desktop vira uma moldura centralizada de 430px */
:root{
  --sea:#0B4F6C; --lagoon:#1683A0; --foam:#EAF4F6; --sand:#F3E6C8; --sun:#C8962E; --red:#B8161D; --gold:#8A6516;
  --bg:#EAF4F6; --card:#FFFFFF; --fg:#0E2A36; --muted:#4F6A75; --line:#CFE0E5;
  --chip:#D7ECF1; --ok:#2E7D5B; --frame:#D5E6EB;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0A3446; --lagoon:#4DB3CC; --foam:#0F2630; --sand:#3A3324; --sun:#E0B24F; --red:#F07A7F; --gold:#E0B24F;
  --bg:#0B1E26; --card:#12303C; --fg:#E6F1F4; --muted:#9DB7C0; --line:#1F4352;
  --chip:#1A4252; --ok:#6CC59A; --frame:#071419; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0A3446; --lagoon:#4DB3CC; --foam:#0F2630; --sand:#3A3324; --sun:#E0B24F; --red:#F07A7F; --gold:#E0B24F;
  --bg:#0B1E26; --card:#12303C; --fg:#E6F1F4; --muted:#9DB7C0; --line:#1F4352;
  --chip:#1A4252; --ok:#6CC59A; --frame:#071419; color-scheme:dark}
html,body{height:100%}
body{background:var(--frame);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
.app{max-width:430px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;padding-bottom:84px;box-shadow:0 0 40px rgba(0,0,0,.08)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--lagoon)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:12px;padding-block:20px 4px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.demo{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--sand);color:var(--fg);padding:2px 8px;border-radius:99px}
button,.btn{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--red);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn:not(.ghost){color:#2A0507}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#2A0507}}
.btn.ghost{background:transparent;color:var(--lagoon);border:1.5px solid var(--lagoon)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
label{font-size:.82rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Hero */
.hero{background:var(--sea);color:#fff;position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1;padding-block:22px 64px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:56px;height:56px;flex:none}
.brand h1{font-size:1.25rem;color:#fff}
.brand p{font-size:.8rem;opacity:.85}
.temple{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:5/3;object-fit:cover;object-position:center 40%;border-radius:14px;border:2px solid rgba(255,255,255,.25)}
.tema{display:flex;flex-direction:column;gap:2px}
.tema .eyebrow{color:#E7C46A}
.tema q{font-family:var(--display);font-size:1.3rem;line-height:1.25;quotes:"“" "”"}
.tema small{opacity:.8}
.waves{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:70px;z-index:0}
.sunball{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:var(--sun);opacity:.22}
.rolebar{position:absolute;top:22px;right:max(16px,env(safe-area-inset-right,0px));z-index:2;display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:.8rem}
.seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;padding:6px 12px;border-radius:99px;font-size:.78rem;font-weight:600;min-height:32px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--sea)}

/* Devocional */
.devo{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;margin-top:-40px;position:relative;z-index:2;box-shadow:0 8px 24px rgba(11,79,108,.12)}
.devo blockquote{margin:0;font-family:var(--display);font-size:1.05rem;color:var(--lagoon)}
.devo .ref{font-size:.8rem;font-weight:700;color:var(--muted)}

/* listas */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--chip);color:var(--sea);display:grid;place-items:center;font-weight:700;flex:none;font-size:.9rem}
:root[data-theme="dark"] .av{color:var(--lagoon)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av{color:var(--lagoon)}}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:600}
.row .sub{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--fg);white-space:nowrap}
.pill.new{background:var(--sand)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--lagoon);display:grid;place-items:center;flex:none}
.bday{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.bday .b{flex:none;width:96px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.bday .b.today{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun) inset}
.bday .d{font-family:var(--display);font-size:1.3rem;color:var(--lagoon);line-height:1}
.bday .n{font-size:.8rem;font-weight:600;line-height:1.2}
.aviso{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.aviso:last-child{border-bottom:0}
.aviso .when{font-size:.75rem;color:var(--muted)}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:.7rem;font-weight:700;color:var(--muted);padding-block:4px}
.cal button{aspect-ratio:1;max-width:100%;border:0;border-radius:10px;background:transparent;color:var(--fg);font-size:.9rem;position:relative;font-variant-numeric:tabular-nums}
.cal button.has::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--lagoon)}
.cal button.bd::before{content:"";position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--sun)}
.cal button.today{background:var(--chip);font-weight:700}
.cal button[aria-pressed="true"]{background:var(--lagoon);color:#fff}
.cal button[aria-pressed="true"]::after{background:#fff}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.ev{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev time{font-weight:700;color:var(--lagoon);min-width:48px;font-variant-numeric:tabular-nums}

/* organograma */
.org{display:flex;flex-direction:column;align-items:center;gap:0}
.org .node{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:center;min-width:0}
.org .node b{display:block;font-size:.9rem}
.org .node span{font-size:.75rem;color:var(--muted)}
.org .node.top{background:var(--sea);color:#fff;border-color:var(--sea)}
.org .node.top span{color:rgba(255,255,255,.8)}
.org .vline{width:2px;height:16px;background:var(--line)}
.org .tier{--n:3;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;width:100%;position:relative;padding-top:16px}
.org .tier::before{content:"";position:absolute;top:0;left:calc(50% / var(--n));right:calc(50% / var(--n));height:2px;background:var(--line)}
.org .tier .node{position:relative}
.org .tier .node::before{content:"";position:absolute;top:-16px;left:50%;width:2px;height:16px;background:var(--line)}
.tabs2{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs2 button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:0 14px;min-height:38px;font-size:.85rem;font-weight:600}
.tabs2 button[aria-pressed="true"]{background:var(--lagoon);border-color:var(--lagoon);color:#fff}

/* indicações */
.rec{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .kind{width:42px;height:56px;border-radius:6px;background:var(--chip);display:grid;place-items:center;flex:none;color:var(--lagoon)}

/* mais */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;color:var(--fg);display:flex;flex-direction:column;gap:8px;min-height:96px}
.menu button svg{color:var(--lagoon)}
.menu button b{font-size:.92rem}
.menu button span{font-size:.75rem;color:var(--muted)}
.lock{display:flex;gap:10px;align-items:flex-start;background:var(--sand);border-radius:12px;padding:12px;font-size:.83rem}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--lagoon);font-weight:600;padding:0;min-height:44px}
.pix{font-family:ui-monospace,Menlo,monospace;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;word-break:break-all;font-size:.85rem}
.qr{width:140px;height:140px;margin:0 auto;border-radius:8px;background:var(--card);border:1px solid var(--line);padding:8px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:600;z-index:30;max-width:90%}

/* nav */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);background:transparent;pointer-events:none}
nav.tabbar .in{pointer-events:auto;width:100%;max-width:430px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
nav.tabbar button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:600;padding:8px 0 10px;min-height:56px}
nav.tabbar button[aria-current="page"]{color:var(--red)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion: no-preference){
  .screen{animation:in .25s ease}
  @keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
}
.brand-card{background:#F7F6F3;border-radius:12px;padding:4px;box-shadow:0 4px 12px rgba(0,0,0,.18);width:104px;flex:none}
.wordmark{display:block;width:100%;max-width:100%;height:auto;border-radius:8px}
.local{margin:0;font-size:.8rem;line-height:1.4;opacity:.85}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tabs2,.bday,.tscroll{scrollbar-width:thin;scrollbar-color:var(--lagoon) var(--chip);padding-bottom:8px;overflow-x:auto;scroll-snap-type:x proximity}
.bday .b{scroll-snap-align:start}
.tabs2::-webkit-scrollbar,.bday::-webkit-scrollbar,.tscroll::-webkit-scrollbar{height:6px}
.tabs2::-webkit-scrollbar-thumb,.bday::-webkit-scrollbar-thumb,.tscroll::-webkit-scrollbar-thumb{background:var(--lagoon);border-radius:99px}
.tabs2::-webkit-scrollbar-track,.bday::-webkit-scrollbar-track,.tscroll::-webkit-scrollbar-track{background:var(--chip);border-radius:99px}
.lrow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;font:inherit;color:var(--fg);cursor:pointer}
.lrow:last-child{border-bottom:0}
.leitura{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.leitura blockquote{margin:0;font-family:var(--display);font-size:1.1rem;color:var(--lagoon)}
.leitura p{line-height:1.7}
.pill.ok{background:#D8EFE3;color:#1D5C40}.pill.no{background:var(--sand);color:var(--fg)}
:root{--c-in:#0B7FA8;--c-out:#B07A12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-in:#3AA3BE;--c-out:#B07A12}}
:root[data-theme="dark"]{--c-in:#3AA3BE;--c-out:#B07A12}
svg.fin{width:100%;max-width:100%;height:auto}
svg.fin .gl{stroke:var(--line);stroke-width:1}
svg.fin .gt{fill:var(--muted);font-size:10px;font-family:var(--body)}
svg.fin .mk rect:hover{opacity:.8}
table.tab{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
table.tab th,table.tab td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tab th:first-child,table.tab td:first-child{text-align:left}
.hero-n{margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.hero-n b{font-family:var(--display);font-size:2.4rem;font-weight:400;color:var(--lagoon)}
.meter{height:12px;border-radius:99px;background:var(--chip);overflow:hidden}.meter i{display:block;height:100%;background:var(--c-in);border-radius:99px}

/* UX mobile: alvos de toque >= 44px, campos 16px (sem zoom no iOS), retorno visual ao tocar */
input,select,textarea{font-size:16px}
*{-webkit-tap-highlight-color:transparent}
button:active,a.iconbtn:active,.menu button:active{transform:scale(.97);opacity:.85}
@media (prefers-reduced-motion: reduce){button:active{transform:none}}
.tabs2 button{min-height:44px}
.chip{min-height:40px}
.link{min-height:44px}
button.acct{min-height:44px}.pw{position:relative;display:block}.pw input{width:100%;padding-right:84px}.pwb{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--sea,#1d4e6b);font:inherit;font-size:.8rem;font-weight:600;padding:8px;min-height:36px;cursor:pointer}
button.link{min-height:44px}
.cal button{aspect-ratio:auto;min-height:40px;min-width:0}
.sobre a{display:inline-flex;align-items:center;min-height:44px}
.radios label,.checks label,label.inline{min-height:44px;align-items:center}
label.inline{align-items:flex-start;padding-block:10px}
nav.tabbar button{font-size:.75rem}
.cal{gap:2px}.cal .h{font-size:.75rem}
.eyebrow{font-size:.75rem}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
</style>

async function ativarPush(silencioso){
  try{
    if(!("serviceWorker"in navigator)||!("PushManager"in window)||!("Notification"in window))return silencioso?0:toast("Este aparelho não aceita notificações com o app fechado. No iPhone, instale o app na tela inicial primeiro.");

    if(Notification.permission!=="granted")return silencioso?0:toast("Permita as notificações nas configurações do navegador.");
    const reg=await navigator.serviceWorker.ready;

async function hashSenha(senha,salt){
  try{const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+senha));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");}
  catch(_){let h=0;for(const c of salt+senha)h=(h*31+c.charCodeAt(0))|0;return "x"+h;}
}

/* Famílias: liga quem cita o outro como pai ou mãe, e irmãos com o mesmo pai e a mesma mãe */
const chave=(x,y)=>[x,y].sort().join("|");
/* Sugestões de parentesco pelo nome; só viram família depois que a liderança confirma */
function sugestoes(){
  const us=ativos().filter(u=>!u.demo), r=[], vistos=new Set();
  const add=(x,y,rel)=>{const k=chave(x.id,y.id);if(vistos.has(k)||db.vinculos[k])return;vistos.add(k);r.push({k,a:x,b:y,rel});};
  for(const u of us)for(const v of us){if(u===v)continue;
    if(mesmoNome(v.nome,u.mae))add(v,u,"mãe de");
    else if(mesmoNome(v.nome,u.pai))add(v,u,"pai de");
    else if(u.pai&&u.mae&&v.pai&&v.mae&&mesmoNome(u.pai,v.pai)&&mesmoNome(u.mae,v.mae))add(u,v,"irmão(ã) de");}
  return r;
}
function familias(){
  const us=ativos().filter(u=>!u.demo), pai=new Map(us.map(u=>[u.id,u.id]));
  const f=x=>{while(pai.get(x)!==x){pai.set(x,pai.get(pai.get(x)));x=pai.get(x);}return x;};
  for(const [k,st] of Object.entries(db.vinculos)){if(st.s!=="ok")continue;const [x,y]=k.split("|");if(pai.has(x)&&pai.has(y))pai.set(f(x),f(y));}
  const g=new Map();for(const u of us){const r=f(u.id);if(!g.has(r))g.set(r,[]);g.get(r).push(u);}
  const grupos=[],sozinhos=[];
  for(const arr of g.values()){
    if(arr.length<2){sozinhos.push(arr[0]);continue;}
    const cont={};arr.forEach(u=>{const t=toks(u.nome);const s=t[t.length-1];if(s)cont[s]=(cont[s]||0)+1;});
    const sob=Object.entries(cont).sort((a,b)=>b[1]-a[1])[0][0];
    const ehPai=u=>arr.some(v=>v!==u&&(mesmoNome(u.nome,v.pai)||mesmoNome(u.nome,v.mae)));
    arr.sort((a,b)=>(ehPai(b)-ehPai(a))||a.nome.localeCompare(b.nome));
    const nomeOrig=arr.map(u=>u.nome.split(" ")).flat().find(w=>norm(w)===sob)||sob;
    grupos.push({nome:"Família "+nomeOrig,membros:arr,ehPai});
  }
  grupos.sort((a,b)=>a.nome.localeCompare(b.nome));
  return {grupos,sozinhos};
}

function telaInicio(){
  const u=me(), us=ativos().filter(x=>!x.demo);
  const niver=us.filter(x=>md(x.nasc)&&md(x.nasc)[0]===M).sort((a,b)=>md(a.nasc)[1]-md(b.nasc)[1]);
  const bodas=us.filter(x=>md(x.casamento)&&md(x.casamento)[0]===M).sort((a,b)=>md(a.casamento)[1]-md(b.casamento)[1]);
  const prox=[];for(let d=D;d<=new Date(Y,M+1,0).getDate()&&prox.length<3;d++){eventosDoDia(d).forEach(e=>prox.length<3&&prox.push([d,...e]));}
  const dv=db.devocionais[0];
  const avisos=db.avisos.filter(a=>a.grupo==="Geral"||isAdmin()||(u&&(u.mins||[]).includes(a.grupo)));
  const pend=db.usuarios.filter(x=>x.status==="pendente").length;
  return hero()+`<div class="wrap">
  ${isAdmin()&&pend?`<button class="alerta" data-go-conta="admin">${icon.shield}<span><b>${pend} cadastro${pend>1?"s":""} aguardando aprovação</b><br><span class="small">Abrir painel do administrador</span></span></button>`:""}
  <article class="devo"><div class="sechead"><span class="eyebrow">${dv?esc(dv.tipo)+" do dia":"Devocional do dia"}</span><span class="small muted">escrito pelo colegiado</span></div>
    ${dv?`<h2>${esc(dv.t)}</h2>${dv.img?`<img class="devo-img" src="${esc(dv.img)}" alt="" loading="lazy">`:""}${dv.ref?`<span class="ref">${esc(dv.ref)}</span>`:""}<p class="muted">${esc(dv.texto.length>140?dv.texto.slice(0,140).trim()+"…":dv.texto)}</p><button class="btn" data-devo="${esc(dv.id)}">Ler ${esc(dv.tipo.toLowerCase())}</button>`
      :`<p class="muted">O primeiro devocional ainda não foi publicado. O colegiado publica pelo painel do administrador.</p>`}
    ${isAdmin()?`<button class="btn ghost" data-go-conta="admin" data-adm="publicar">Publicar devocional ou reflexão</button>`:podeDevo()?`<button class="btn ghost" data-go="publicar">Publicar devocional ou reflexão</button>`:""}
  </article>

  <section class="section"><div class="sechead"><h2>Aniversariantes de ${MESES[M]}</h2><span class="small muted">${niver.length?niver.length+" pessoa"+(niver.length>1?"s":""):""}</span></div>
    ${niver.length?`<div class="bday" role="list" aria-label="Aniversariantes do mês">${niver.map(x=>{const dd=md(x.nasc)[1];return `<div class="b ${dd===D?"today":""}"><div class="d">${String(dd).padStart(2,"0")}</div>${avatar(x)}<div class="n">${esc(x.nome.split(" ")[0])}</div>${dd===D?'<span class="pill new">Hoje</span>':""}</div>`;}).join("")}</div>`
      :`<div class="vazio">Os aniversariantes aparecem aqui conforme os membros fazem o cadastro.</div>`}
  </section>
  ${bodas.length?`<section class="section"><div class="sechead"><h2>Bodas de ${MESES[M]}</h2><span class="small muted">aniversários de casamento</span></div>
    <div class="bday" role="list">${bodas.map(x=>{const c=md(x.casamento);return `<div class="b" role="listitem"><div class="d">${String(c[1]).padStart(2,"0")}</div>${avatar(x)}<div class="n">${esc(x.nome.split(" ")[0])}</div><span class="small muted">${Y-c[2]} anos</span></div>`;}).join("")}</div></section>`:""}

  <section class="section"><div class="sechead"><h2>Mural de avisos</h2>${podeAviso()?'<button class="back" data-go="enviar">Novo aviso</button>':""}</div>
    ${avisos.length?`<div class="card list">${avisos.map(a=>`<div class="aviso"><div class="sechead"><b>${esc(a.t)}</b>${a.grupo!=="Geral"?`<span class="pill">${esc(a.grupo)}</span>`:""}</div><p class="small pre">${esc(a.x)}</p>${a.img?`<img class="devo-img" src="${esc(a.img)}" alt="" loading="lazy">`:""}<span class="when">${esc((a.data||"").split("-").reverse().join("/"))}</span>
      ${podeAviso()?`<button class="link danger" data-ask="delAviso" data-id="${esc(a.id)}">Excluir aviso</button>${confirmBox("delAviso",a.id,"Excluir este aviso?","Excluir")}`:""}</div>`).join("")}</div>`:`<div class="vazio">Nenhum aviso no momento.</div>`}
  </section>

  <section class="section"><div class="sechead"><h2>Próximos encontros</h2><button class="back" data-tab-go="agenda">Ver agenda</button></div>
    <div class="card list">${prox.length?prox.map(e=>`<div class="ev"><time>${String(e[0]).padStart(2,"0")}/${String(M+1).padStart(2,"0")}</time><div><b>${e[2]}</b><div class="small muted">${e[1]} · ${LOC[e[3]]}</div></div></div>`).join(""):'<p class="muted small">Sem programação no restante do mês.</p>'}</div>
  </section>

  <section class="section sobre"><div class="sechead"><h2>Sobre a IBR</h2></div>
    <div class="card"><p><b>Vivendo Cristo, transformando vidas e fazendo discípulos.</b> <span class="muted small">Romanos 12:1-3</span></p>
    <p>Fundada em 2017. Uma igreja fundada e fundamentada em Jesus Cristo.</p>
    <p class="small muted">Sede: Av. Luís Firmino de Sousa, 1707, Timon-MA</p>
    <p class="small">Secretaria (WhatsApp): <b>(86) 98864-9903</b> · <a href="https://wa.me/5586988649903" target="_blank" rel="noopener">abrir conversa</a></p></div>
  </section></div>`;
}
const avatar=u=>u.foto?`<img class="av" src="${esc(u.foto)}" alt="">`:`<div class="av" aria-hidden="true">${esc(ini(u.nome))}</div>`;

function telaDevo(){
  const lst=db.devocionais, dv=lst.find(d=>d.id===state.devoId)||lst[0];
  if(!dv)return `<div class="wrap"><div class="section">${voltar("inicio")}<h2>Devocional</h2><div class="vazio">Nenhum devocional publicado ainda.</div></div></div>`;

const brl=n=>"R$ "+Math.round(n).toLocaleString("pt-BR");
const MES3=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function graficoFin(rows){
  const W=360,H=200,pl=8,pb=34,pt=22,max=Math.max(1,...rows.flatMap(r=>[r.ent,r.sai]));
  const top=Math.ceil(max/1000)*1000||1000, n=rows.length, gw=(W-pl*2)/n, bw=Math.min(22,(gw-10)/2), y=v=>pt+(H-pt-pb)*(1-v/top);
  const grid=[0,.5,1].map(f=>`<line x1="${pl}" x2="${W-pl}" y1="${y(top*f)}" y2="${y(top*f)}" class="gl"/><text x="${W-pl}" y="${y(top*f)-4}" text-anchor="end" class="gt">${brl(top*f)}</text>`).join("");
  const bar=(x,v,c,lab)=>{const yy=y(v),h=Math.max(0,H-pb-yy);return `<g class="mk"><rect x="${x}" y="${yy}" width="${bw}" height="${h}" rx="3" fill="var(${c})"><title>${lab}: ${brl(v)}</title></rect></g>`;};
  const g=rows.map((r,i)=>{const cx=pl+gw*i+gw/2, m=md(r.mes+"-01");return bar(cx-bw-1,r.ent,"--c-in",`${MES3[m[0]]}/${m[2]} entradas`)+bar(cx+1,r.sai,"--c-out",`${MES3[m[0]]}/${m[2]} saídas`)+`<text x="${cx}" y="${H-pb+16}" text-anchor="middle" class="gt">${MES3[m[0]]}</text>`;}).join("");
  return `<svg class="fin" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas por mês">${grid}${g}</svg>`;
}

function acao(a,id){
  const adminOnly=["delFin","aprovar","recusar","excluir","aprovarRec","recusarRec","delVisita","resetSenha"];
  const perm={delDevo:podeDevo,delAviso:podeAviso,delAlbum:podeAlbum};
  if(adminOnly.includes(a)&&!isAdmin())return toast("Apenas administradores");
  if(perm[a]&&!perm[a]())return toast("Você não tem permissão para isso");
  const u=db.usuarios.find(x=>x.id===id);
  if(a==="resetSenha"&&u&&!u.demo&&u.id!==db.sessao){resetarSenha(u);state.confirm=null;return;}
  if(a==="delServ"){const sv=db.servicos.find(x=>x.id===id);if(sv&&(sv.por===db.sessao||isAdmin())){db.servicos=db.servicos.filter(x=>x.id!==id);toast("Anúncio removido");}}
  if(a==="aprovar"&&u){u.status="ativo";u.novo=false;toast("Cadastro aprovado");}
  if(a==="recusar"&&u&&!u.demo&&u.status==="pendente"){db.usuarios=db.usuarios.filter(x=>x.id!==id);Object.keys(db.vinculos).forEach(k=>{if(k.split("|").includes(id))delete db.vinculos[k];});toast("Cadastro recusado e apagado");}
  if(a==="excluir"&&u&&!u.demo&&u.id!==db.sessao){db.usuarios=db.usuarios.filter(x=>x.id!==id);Object.keys(db.vinculos).forEach(k=>{if(k.split("|").includes(id))delete db.vinculos[k];});toast("Cadastro excluído");}
  if(a==="aprovarRec"){const r=db.recs.find(x=>x.id===id);if(r)r.status="aprovada";toast("Indicação publicada");}
  if(a==="recusarRec"){db.recs=db.recs.filter(x=>x.id!==id);toast("Indicação recusada");}
  if(a==="delDevo"){db.devocionais=db.devocionais.filter(x=>x.id!==id);toast("Publicação excluída");}
  if(a==="delAviso"){db.avisos=db.avisos.filter(x=>x.id!==id);toast("Aviso excluído");}
  if(a==="delVisita"){db.visitas=db.visitas.filter(x=>x.id!==id);toast("Registro excluído");}
  if(a==="delAlbum"){db.albuns=db.albuns.filter(x=>x.id!==id);toast("Álbum excluído");}
  if(a==="delFin"){db.financas=db.financas.filter(x=>x.mes!==id);toast("Mês apagado");}
  if(a==="orado"){db.pedidos=db.pedidos.filter(x=>x.id!==id);toast("Pedido marcado como atendido");}
  state.confirm=null;salvar();render();
}

function lerImagem(file,max){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type))return rej();const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

  if(f==="fOr"){const dest=(el('input[name="oD"]:checked')||{}).value||"intercessao";db.pedidos.unshift({id:uid(),x:v("oX"),nome:v("oN"),data:hojeISO,destino:dest,por:db.sessao});salvar();go("mais");return toast(dest==="igreja"?"Pedido compartilhado com a igreja":dest==="pastor"?"Pedido enviado ao pastor e ao colegiado":"Pedido enviado ao Ministério de Intercessão");}
  if(f==="fDevo"&&podeDevo()){let img="";const fi=el("#dI")&&el("#dI").files[0];if(fi){try{img=await enviarImagem(fi,"devocionais",900);}catch(_){toast("Não foi possível enviar a imagem. Publicado sem ela.");}}
    db.devocionais.unshift({id:uid(),tipo:v("dTp"),t:v("dT"),ref:v("dR"),vers:v("dV"),texto:v("dX"),autor:v("dA"),data:hojeISO,img});salvar();ev.target.reset();render();return toast("Publicado na tela inicial");}
  if(f==="fFin"&&isAdmin()){
    const num=x=>{const t=String(x).replace(/\s|R\$/g,"").replace(/\./g,"").replace(",",".");return t===""?NaN:Number(t);};
    const r={mes:v("fM"),ent:num(v("fE")),sai:num(v("fS")),pot:parseInt(v("fP"),10),cump:parseInt(v("fC"),10)};
    if(!r.mes)return mostrarErro(ev.target,"Escolha o mês.");
    if([r.ent,r.sai].some(x=>!isFinite(x)||x<0))return mostrarErro(ev.target,"Informe entradas e saídas em reais, por exemplo 12.500,00.");
    if(!(r.pot>=0)||!(r.cump>=0)||r.cump>r.pot)return mostrarErro(ev.target,"Informe as quantidades de dizimistas; quem contribui não pode passar dos potenciais.");
    db.financas=db.financas.filter(x=>x.mes!==r.mes);db.financas.push(r);salvar();render();return toast("Mês salvo");
  }
  if(f==="fAlbum"&&podeAlbum()){
    const files=[...el("#alF").files].slice(0,9), fotos=[];
    for(const fl of files){try{fotos.push(await lerImagem(fl,600));}catch(_){}}
    if(!fotos.length)return toast("Escolha ao menos uma imagem");
    db.albuns.unshift({id:uid(),t:v("alT"),data:v("alD"),fotos});if(!salvar())db.albuns.shift();render();return toast("Álbum publicado");
  }
});
render();
(async()=>{
  try{if(localStorage.getItem("ibr_temp")&&!sessionStorage.getItem("ibr_ses")){await sb.auth.signOut();localStorage.removeItem("ibr_temp");}}catch(_){}
  const st=await carregar(true).catch(()=>"erro");
  setInterval(()=>{checarAvisos();},60000);
  setTimeout(()=>{try{if(db.sessao&&localStorage.getItem("ibr_alertas")!=="off")ativarPush(true);}catch(_){}},5000);
  render();
  if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
})();
})();

</script>
